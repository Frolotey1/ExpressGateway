services:
  meteohost-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteohost-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApiKey=*****
      - ExpressProperties__bot=*****
    restart: unless-stopped
    networks:
      - meteohost-network

networks:
  meteohost-network:
    driver: bridge
